<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>表格圆角边框对照探针</title></head><body><article>
<h1>表格圆角边框对照（勿发布）</h1><p>每组均应为浅绿底、红色圆角外框；表格两列的文字完整显示。</p>
<h2>R01 原始 B05 对照</h2><table width="100%" border="1" cellspacing="0" cellpadding="12" style="background-color:#d6f3df;border:2px solid #c65040;border-radius:18px"><tr><td>左列 R01</td><td>右列 R01</td></tr></table>
<h2>R02 表格 separate</h2><table width="100%" cellspacing="0" cellpadding="12" style="border-collapse:separate;border-spacing:0;background-color:#d6f3df;border:2px solid #c65040;border-radius:18px"><tr><td>左列 R02</td><td>右列 R02</td></tr></table>
<h2>R03 外层 section 圆角</h2><section style="background-color:#d6f3df;border:2px solid #c65040;border-radius:18px;padding:8px"><table width="100%" cellspacing="0" cellpadding="4" style="width:100%"><tr><td>左列 R03</td><td>右列 R03</td></tr></table></section>
<h2>R04 单元格分别绘制边框</h2><table width="100%" cellspacing="0" cellpadding="12" style="border-collapse:separate;border-spacing:0;width:100%"><tr><td style="background-color:#d6f3df;border:2px solid #c65040;border-right:0;border-radius:18px 0 0 18px">左列 R04</td><td style="background-color:#d6f3df;border:2px solid #c65040;border-left:0;border-radius:0 18px 18px 0">右列 R04</td></tr></table>
<h2>R05 无表格 section 对照</h2><section style="background-color:#d6f3df;border:2px solid #c65040;border-radius:18px;padding:12px">文字 R05：单独的圆角矩形</section>
</article></body></html>
