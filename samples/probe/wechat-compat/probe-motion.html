<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>SVG 动效小样 · 勿发布</title></head><body><article><h1>SVG 动效小样（勿发布）</h1><p>四个循环动效，文字说明保留在 SVG 外；每个项目应在约 8 秒内重复。保存重开及手机预览后逐项核对。</p>
<h2>M01 打字和光标</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" style="display:block;max-width:600px"><rect width="600" height="160" rx="12" fill="#f1f5f8"/><rect x="20" y="40" width="560" height="78" rx="8" fill="white" stroke="#93a9bd"/><text x="40" y="95" font-size="30" fill="#23384f">你<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.050;0.062;1" dur="8s" repeatCount="indefinite"/></text><text x="72" y="95" font-size="30" fill="#23384f">好<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.119;0.131;1" dur="8s" repeatCount="indefinite"/></text><text x="104" y="95" font-size="30" fill="#23384f">，<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.188;0.200;1" dur="8s" repeatCount="indefinite"/></text><text x="136" y="95" font-size="30" fill="#23384f">公<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.256;0.269;1" dur="8s" repeatCount="indefinite"/></text><text x="168" y="95" font-size="30" fill="#23384f">众<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.325;0.338;1" dur="8s" repeatCount="indefinite"/></text><text x="200" y="95" font-size="30" fill="#23384f">号<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.394;0.406;1" dur="8s" repeatCount="indefinite"/></text><rect x="40" y="66" width="3" height="35" fill="#c45c3b"><animateTransform attributeName="transform" type="translate" values="0 0;32 0;64 0;96 0;128 0;160 0;192 0;192 0" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect></svg>
<p>预期：文字逐字出现、光标向右移动，循环重新开始。</p>
<h2>M02 内容逐个出现</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" style="display:block;max-width:600px"><rect width="600" height="160" rx="12" fill="#f1f5f8"/><g opacity="0"><rect x="30" y="50" width="120" height="65" rx="9" fill="#627ead"/><text x="55" y="90" font-size="18" fill="white">模块 1</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.062;0.075;1" dur="8s" repeatCount="indefinite"/></g><g opacity="0"><rect x="175" y="50" width="120" height="65" rx="9" fill="#3c987d"/><text x="200" y="90" font-size="18" fill="white">模块 2</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.175;0.188;1" dur="8s" repeatCount="indefinite"/></g><g opacity="0"><rect x="320" y="50" width="120" height="65" rx="9" fill="#d58c49"/><text x="345" y="90" font-size="18" fill="white">模块 3</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.287;0.300;1" dur="8s" repeatCount="indefinite"/></g><g opacity="0"><rect x="465" y="50" width="120" height="65" rx="9" fill="#9271aa"/><text x="490" y="90" font-size="18" fill="white">模块 4</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.400;0.413;1" dur="8s" repeatCount="indefinite"/></g></svg>
<p>预期：四个彩色模块依次出现，然后重新开始。</p>
<h2>M03 终端逐行输出</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" style="display:block;max-width:600px"><rect width="600" height="160" rx="12" fill="#f1f5f8"/><rect x="0" y="0" width="600" height="160" rx="12" fill="#1e2938"/><text x="30" y="38" fill="#dce6ef" font-family="monospace" font-size="20" opacity="0">$ 准备资源<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.062;0.075;1" dur="8s" repeatCount="indefinite"/></text><text x="30" y="70" fill="#7ee1ac" font-family="monospace" font-size="20" opacity="0">✓ 资源就绪<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.212;0.225;1" dur="8s" repeatCount="indefinite"/></text><text x="30" y="102" fill="#dce6ef" font-family="monospace" font-size="20" opacity="0">$ 构建内容<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.362;0.375;1" dur="8s" repeatCount="indefinite"/></text><text x="30" y="134" fill="#7ee1ac" font-family="monospace" font-size="20" opacity="0">✓ 构建完成<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.512;0.525;1" dur="8s" repeatCount="indefinite"/></text></svg>
<p>预期：命令和绿色勾选依次出现，然后循环。</p>
<h2>M04 流程图逐步展示</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" style="display:block;max-width:600px"><rect width="600" height="160" rx="12" fill="#f1f5f8"/><g opacity="0"><rect x="25" y="45" width="150" height="65" rx="8" fill="#3c738b"/><text x="52" y="85" font-size="20" fill="white">输入</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.050;0.062;1" dur="8s" repeatCount="indefinite"/></g><g opacity="0"><rect x="220" y="45" width="150" height="65" rx="8" fill="#3c738b"/><text x="247" y="85" font-size="20" fill="white">转换</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.225;0.237;1" dur="8s" repeatCount="indefinite"/></g><g opacity="0"><rect x="415" y="45" width="150" height="65" rx="8" fill="#3c738b"/><text x="442" y="85" font-size="20" fill="white">交付</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.400;0.412;1" dur="8s" repeatCount="indefinite"/></g><path d="M180 77h30 l-8 -7 m8 7 l-8 7" stroke="#e17a52" stroke-width="3" fill="none" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.175;0.188;1" dur="8s" repeatCount="indefinite"/></path><path d="M375 77h30 l-8 -7 m8 7 l-8 7" stroke="#e17a52" stroke-width="3" fill="none" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.350;0.362;1" dur="8s" repeatCount="indefinite"/></path></svg>
<p>预期：输入、箭头、转换、箭头、交付依次出现，然后循环。</p></article></body></html>
