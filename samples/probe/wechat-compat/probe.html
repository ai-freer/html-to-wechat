<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>公众号兼容性探针</title><style>body{font-family:sans-serif;color:#243047;font-size:16px;line-height:1.7}.flex{display:flex;gap:12px}.grid{display:grid;grid-template-columns:1fr 2fr;gap:12px}.box{background:#e6f4f0;padding:12px;border:2px solid #2e8b70;border-radius:12px}.position{position:relative;height:70px;background:#f6f0df}.position span{position:absolute;left:36px;top:20px;background:#f7c65b}</style></head><body><article><h1>公众号排版与 SVG 兼容性探针</h1><p>测试草稿：仅用于观察，不含真实用户内容。每项以编号记录复制、保存、手机预览结果。</p>
<h2>L01 基础样式</h2><div class="box">浅绿背景、圆角、边框和文字应完整；<strong>加粗</strong>、<em>斜体</em>清晰。</div>
<h2>L02 横向 Flex</h2><div class="flex"><div class="box">左列 L02-A</div><div class="box">右列 L02-B</div></div>
<h2>L03 网格</h2><div class="grid"><div class="box">窄列</div><div class="box">宽列约两倍</div></div>
<h2>L04 定位叠层</h2><div class="position"><span>黄色标签应向右下偏移</span></div>
<h2>L05 表格</h2><table border="1" style="border-collapse:collapse;width:100%"><tr><th>项目</th><th>说明</th></tr><tr><td>A</td><td>这里应是宽列，文字完整显示。</td></tr></table>
<h2>S01 SVG 静态与引用</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80"><defs><marker id="probe-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#c65a26"/></marker></defs><path d="M20 40H290" stroke="#c65a26" stroke-width="4" marker-end="url(#probe-arrow)"/><text x="20" y="25">橙色直线右侧应有箭头</text></svg>
<h2>S02 自动循环动画</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80"><rect width="320" height="80" fill="#e6f4f0"/><circle cx="35" cy="40" r="16" fill="#e76f51"><animate attributeName="cx" values="35;285;35" dur="3s" repeatCount="indefinite"/></circle><text x="10" y="72">红点应左右往返</text></svg>
<h2>S03 点击切换</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100"><rect width="320" height="100" fill="#e2edf8"/><text x="15" y="30">点击蓝色区域，变为绿色</text><rect id="probe-button" x="20" y="44" width="280" height="45" fill="#4c83b6"><set attributeName="fill" to="#209b70" begin="click" dur="0.01s" fill="freeze"/></rect></svg>
<h2>S04 点击动画</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100"><text x="15" y="25">点击橙色圆点，应向右移动</text><circle cx="40" cy="65" r="20" fill="#e76f51"><animate attributeName="cx" from="40" to="270" dur="1s" begin="click" fill="freeze"/></circle></svg>
<h2>S05 动画引用链</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80"><circle cx="40" cy="40" r="20" fill="#df7655"><animate id="probe-first" attributeName="cx" from="40" to="140" dur="1s" fill="freeze"/><animate attributeName="cx" from="140" to="280" begin="probe-first.end" dur="1s" fill="freeze"/></circle></svg>
<p>探针结束。此文仅用于兼容性记录。</p></article></body></html>
