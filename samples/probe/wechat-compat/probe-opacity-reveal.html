<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>SVG 点击显现对照（勿发布）</title></head><body><article><h1>SVG 点击显现对照（勿发布）</h1><p>每项均应在点击前没有绿色文字，点击蓝色区域后按说明出现。请记录粘贴、保存重开和 iOS 预览。</p>
<h2>O01 透明容器</h2><p>点击前无文字；点击蓝色区域后出现「内容已出现」。</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" style="max-width:600px;display:block"><rect width="600" height="140" fill="#edf5f2"/><rect x="20" y="65" width="560" height="55" fill="#4288bd"/><g opacity="0"><set attributeName="opacity" to="1" begin="click" dur="0.01s" fill="freeze"/><text x="28" y="45" font-size="24" fill="#168458">内容已出现</text><rect x="20" y="65" width="560" height="55" fill="#000" fill-opacity="0" pointer-events="all"/></g></svg>
<h2>O02 嵌套透明容器</h2><p>点击前无文字；点击后先出现「第一步」，约一秒后出现「第二步」。</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" style="max-width:600px;display:block"><rect width="600" height="160" fill="#edf5f2"/><rect x="20" y="95" width="560" height="50" fill="#4288bd"/><g opacity="0"><set attributeName="opacity" to="1" begin="click" dur="0.01s" fill="freeze"/><text x="28" y="38" font-size="22" fill="#168458">第一步</text><g opacity="0"><set attributeName="opacity" to="1" begin="click+0.8s" dur="0.01s" fill="freeze"/><text x="28" y="75" font-size="22" fill="#168458">第二步</text><rect x="20" y="95" width="560" height="50" fill="#000" fill-opacity="0" pointer-events="all"/></g></g></svg>
<h2>O03 遮盖层消失</h2><p>点击前只有蓝色方块；点击方块后方块消失，露出「内容已出现」。</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="100%" style="max-width:600px;display:block"><rect width="600" height="100" fill="#edf5f2"/><text x="28" y="58" font-size="24" fill="#168458">内容已出现</text><g><set attributeName="opacity" to="0" begin="click" dur="0.01s" fill="freeze"/><rect x="20" y="15" width="560" height="70" fill="#4288bd"/></g></svg>
<h2>O04 遮盖层移开</h2><p>点击前只有蓝色方块；点击后方块向下移开，露出「内容已出现」。</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" width="100%" style="max-width:600px;display:block"><rect width="600" height="170" fill="#edf5f2"/><text x="28" y="58" font-size="24" fill="#168458">内容已出现</text><g><animateTransform attributeName="transform" type="translate" values="0 0;0 85" begin="click" dur="0.6s" fill="freeze"/><rect x="20" y="15" width="560" height="70" fill="#4288bd"/></g></svg>
<h2>O05 不透明度样式容器</h2><p>点击前无文字；点击蓝色区域后出现「内容已出现」。</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" style="max-width:600px;display:block"><rect width="600" height="140" fill="#edf5f2"/><rect x="20" y="65" width="560" height="55" fill="#4288bd"/><g style="opacity:0"><set attributeName="opacity" to="1" begin="click" dur="0.01s" fill="freeze"/><text x="28" y="45" font-size="24" fill="#168458">内容已出现</text><rect x="20" y="65" width="560" height="55" fill="#000" fill-opacity="0" pointer-events="all"/></g></svg>
</article></body></html>
