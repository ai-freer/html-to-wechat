<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>SVG 点击事件对照（勿发布）</title></head><body><article><h1>SVG 点击事件对照（勿发布）</h1><p>每项点击后观察变化；分别记录粘贴后、保存重开、iOS 预览。此页用于定位差异，不预设哪个方案通过。</p>
<h2>D01 点击元素自身（已通过的对照）</h2><p>点蓝色方块，应保持变绿。</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="100%" style="max-width:600px;display:block"><rect x="20" y="15" width="560" height="70" fill="#4288bd"><set attributeName="fill" to="#24a375" begin="click" dur="0.01s" fill="freeze"/></rect></svg>
<h2>D02 点击热区冒泡到外层</h2><p>点蓝色区域，整块应闪一下。</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="100%" style="max-width:600px;display:block"><g><animate attributeName="opacity" values="1;.2;1" dur="0.8s" begin="click" fill="freeze" restart="always"/><rect x="20" y="15" width="560" height="70" fill="#4288bd"/><rect x="20" y="15" width="560" height="70" fill="#000" fill-opacity="0" pointer-events="all"/></g></svg>
<h2>D03 隐藏容器内的可见热区</h2><p>点蓝色区域，应出现绿色「内容已出现」。</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" style="max-width:600px;display:block"><rect width="600" height="140" fill="#edf5f2"/><g visibility="hidden"><set attributeName="visibility" to="visible" begin="click" dur="0.01s" fill="freeze"/><text x="28" y="45" font-size="24" fill="#168458">内容已出现</text><rect x="20" y="65" width="560" height="55" fill="#4288bd" visibility="visible" pointer-events="all"/></g></svg>
<h2>D04 嵌套容器依次显示</h2><p>点蓝色区域，依次出现「第一步」「第二步」。</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" style="max-width:600px;display:block"><rect width="600" height="160" fill="#edf5f2"/><g visibility="hidden"><set attributeName="visibility" to="visible" begin="click" dur="0.01s" fill="freeze"/><text x="28" y="38" font-size="22" fill="#168458">第一步</text><g visibility="hidden"><set attributeName="visibility" to="visible" begin="click+0.7s" dur="0.01s" fill="freeze"/><text x="28" y="75" font-size="22" fill="#168458">第二步</text><rect x="20" y="95" width="560" height="50" fill="#4288bd" visibility="visible" pointer-events="all"/></g></g></svg>
<h2>D05 跨元素事件引用（原 C01/C02 写法）</h2><p>点蓝色区域，绿色文字应出现。</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" style="max-width:600px;display:block"><rect width="600" height="140" fill="#edf5f2"/><rect id="d05button" x="20" y="65" width="560" height="55" fill="#4288bd"/><g visibility="hidden"><set attributeName="visibility" to="visible" begin="d05button.click" dur="0.01s" fill="freeze"/><text x="28" y="45" font-size="24" fill="#168458">引用成功</text></g></svg>
<h2>D06 自身点击加延迟</h2><p>点蓝色区域，约一秒后变绿。</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="100%" style="max-width:600px;display:block"><rect x="20" y="15" width="560" height="70" fill="#4288bd"><set attributeName="fill" to="#24a375" begin="click+0.8s" dur="0.01s" fill="freeze"/></rect></svg>
</article></body></html>
