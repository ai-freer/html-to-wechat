<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>点击显现对照测试</title><style>body{font:16px/1.7 system-ui,sans-serif;color:#243a31;max-width:780px;margin:30px auto;padding:0 20px}button{font:inherit;background:#267556;color:#fff;border:0;border-radius:8px;padding:10px 14px}a{color:#176850}textarea{box-sizing:border-box;width:100%;height:120px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd9d1;padding:8px;text-align:left}</style></head><body><h1>点击显现对照测试（勿发布）</h1><p>测试前可先在<a href="probe-opacity-reveal.html" target="_blank">原始探针</a>试点五项。此页测试透明度和遮盖方式，寻找点击后显现内容的可用写法。</p><ol><li>点击下方按钮复制源码，在<a href="../../../web/richtext/" target="_blank">模式 1 转换页</a>粘贴并转换，再点击转换页的复制按钮。</li><li>粘贴到新的公众号草稿，逐项点击观察；保存、关闭、重新打开后再测一次。</li><li>用 iOS 微信扫码预览后重复点击，O02、O04 每次点击请等待约 1 秒。</li></ol><button id="copy">复制显现探针 HTML</button><p id="status">正在加载…</p><textarea id="source" readonly aria-label="探针源码"></textarea><table><tr><th>编号</th><th>粘贴后</th><th>保存重开</th><th>iOS 预览</th></tr><tr><td>O01 透明容器</td><td></td><td></td><td></td></tr><tr><td>O02 嵌套透明容器</td><td></td><td></td><td></td></tr><tr><td>O03 遮盖层消失</td><td></td><td></td><td></td></tr><tr><td>O04 遮盖层移开</td><td></td><td></td><td></td></tr><tr><td>O05 样式透明容器</td><td></td><td></td><td></td></tr></table><p>请按 Y / N / 部分记录；若某项只有部分效果，请描述具体情况。</p><script>let box=document.querySelector('#source'),status=document.querySelector('#status');fetch('probe-opacity-reveal.html').then(r=>{if(!r.ok)throw Error();return r.text()}).then(t=>{box.value=t;status.textContent='探针已加载。'}).catch(()=>status.textContent='请通过本地 HTTP 服务打开此页。');document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(box.value);status.textContent='已复制，请粘贴到模式 1。'}catch(e){box.select();status.textContent='自动复制不可用，请在下方全选并复制。'}};</script></body></html>
