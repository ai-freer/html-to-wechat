<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>SVG 交互兼容探针（勿发布）</title></head><body><article><h1>SVG 交互兼容探针（勿发布）</h1><p>请在转换复制、公众号粘贴、草稿保存重开及 iOS 微信预览的每个阶段逐项检查；预设输入并非真实输入。</p>
<h2>E01 闪烁</h2><p>预期：圆点按约 1.1 秒周期闪烁。</p>
<svg style="display:block;max-width:600px;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="100%" aria-label="光标闪烁"><!-- Adapted from JamieJustTang/wechat-animating, MIT; see ../original/LICENSE --><rect width="300" height="180" fill="#efe8d8"/><circle cx="150" cy="90" r="30" fill="#da6139"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></circle></svg>

<h2>E02 透明度脉冲</h2><p>预期：圆点平滑变淡、变亮。</p>
<svg style="display:block;max-width:600px;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="100%" aria-label="透明度脉冲"><!-- Adapted from JamieJustTang/wechat-animating, MIT; see ../original/LICENSE --><rect width="300" height="180" fill="#efe8d8"/><circle cx="150" cy="90" r="30" fill="#da6139"><animate attributeName="opacity" values="1;.35;1" keyTimes="0;.5;1" dur="2.8s" repeatCount="indefinite"/></circle></svg>

<h2>E03 旋转</h2><p>预期：星形图案持续旋转。</p>
<svg style="display:block;max-width:600px;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="100%" aria-label="持续旋转"><!-- Adapted from JamieJustTang/wechat-animating, MIT; see ../original/LICENSE --><rect width="300" height="180" fill="#efe8d8"/><g><animateTransform attributeName="transform" type="rotate" values="0 150 90;360 150 90" dur="4s" repeatCount="indefinite"/><path d="M150 42 L162 78 L200 90 L162 102 L150 138 L138 102 L100 90 L138 78 Z" fill="#da6139"/></g></svg>

<h2>E04 重复点击</h2><p>预期：点击按钮闪一下；再点能重新闪。</p>
<svg style="display:block;max-width:600px;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="100%" aria-label="点击重播闪动"><!-- Adapted from JamieJustTang/wechat-animating, MIT; see ../original/LICENSE --><rect width="300" height="180" fill="#efe8d8"/><g><rect x="60" y="55" width="180" height="70" rx="12" fill="#da6139"/><text x="150" y="99" text-anchor="middle" fill="white" font-size="22" pointer-events="none">点击重播</text><animate attributeName="opacity" values="1;0.15;1" keyTimes="0;.5;1" begin="click" dur="0.6s" restart="always" fill="freeze"/></g></svg>

<h2>C01 模拟输入和执行</h2><p>预期：点击输入框，预设文字逐字出现且光标右移；点击运行，终端依次显示分析、生成和完成，可再次点击运行。</p>
<svg style="display:block;max-width:600px;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" role="img" aria-label="点击模拟输入与执行">
<!-- Original composite demonstration. Animation patterns adapted from JamieJustTang/wechat-animating, MIT; see ../original/LICENSE. -->
<rect width="680" height="420" rx="22" fill="#101d28"/><text x="30" y="45" fill="#84d6ba" font-size="19">01 / 交互终端 · 模拟输入</text><text x="30" y="75" fill="#c8d5df" font-size="16">点击输入框 → 等待打字 → 点击运行 → 查看反馈</text>
<rect id="c1type" x="30" y="100" width="620" height="62" rx="10" fill="#263849" stroke="#668195"/><text x="48" y="139" fill="#7e99aa" font-size="19" pointer-events="none">点击此处输入预设指令</text>
<g visibility="hidden"><set attributeName="visibility" to="visible" begin="c1type.click" fill="freeze"/><rect x="31" y="101" width="618" height="60" rx="9" fill="#263849" pointer-events="none"/><text x="48" y="139" fill="#f4fcf8" font-size="21" pointer-events="none"><tspan opacity="0">生<set attributeName="opacity" to="1" begin="c1type.click+0.00s" fill="freeze"/></tspan><tspan opacity="0">成<set attributeName="opacity" to="1" begin="c1type.click+0.23s" fill="freeze"/></tspan><tspan opacity="0">公<set attributeName="opacity" to="1" begin="c1type.click+0.46s" fill="freeze"/></tspan><tspan opacity="0">众<set attributeName="opacity" to="1" begin="c1type.click+0.69s" fill="freeze"/></tspan><tspan opacity="0">号<set attributeName="opacity" to="1" begin="c1type.click+0.92s" fill="freeze"/></tspan><tspan opacity="0">排<set attributeName="opacity" to="1" begin="c1type.click+1.15s" fill="freeze"/></tspan><tspan opacity="0">版<set attributeName="opacity" to="1" begin="c1type.click+1.38s" fill="freeze"/></tspan></text><rect x="48" y="117" width="3" height="26" fill="#8ff2c6" pointer-events="none"><animateTransform attributeName="transform" type="translate" values="0 0;21 0;42 0;63 0;84 0;105 0;126 0;147 0" calcMode="discrete" dur="1.8s" begin="c1type.click" fill="freeze"/></rect></g>
<rect id="c1run" x="30" y="183" width="150" height="48" rx="9" fill="#5acb9f"/><text x="105" y="214" text-anchor="middle" fill="#0e3024" font-size="19" font-weight="bold" pointer-events="none">运行指令 →</text><text x="199" y="213" fill="#aabcc9" font-size="15">可再次点击运行重播</text>
<g visibility="hidden"><set attributeName="visibility" to="visible" begin="c1run.click" fill="freeze"/><rect x="30" y="255" width="620" height="130" rx="10" fill="#1b2e3b"/><text x="50" y="288" fill="#96b8c5" font-size="18">› 正在分析内容<animate attributeName="opacity" values="0;1" dur="0.25s" begin="c1run.click" fill="freeze"/></text><text x="50" y="325" fill="#96b8c5" font-size="18" opacity="0">› 正在生成版式<set attributeName="opacity" to="0" begin="c1run.click" fill="freeze"/><set attributeName="opacity" to="1" begin="c1run.click+0.6s" fill="freeze"/></text><text x="50" y="362" fill="#7becba" font-size="18" opacity="0">✓ 已完成 · 可继续下一步<set attributeName="opacity" to="0" begin="c1run.click" fill="freeze"/><set attributeName="opacity" to="1" begin="c1run.click+1.2s" fill="freeze"/></text></g>
</svg>

<h2>C02 选项分支和弹窗</h2><p>预期：分别点击 A、B，内容切换；打开弹窗并关闭；点回到初始状态，分支内容消失。</p>
<svg style="display:block;max-width:600px;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="100%" role="img" aria-label="点击选项与弹窗">
<!-- Original composite demonstration. Click and timing patterns adapted from JamieJustTang/wechat-animating, MIT; see ../original/LICENSE. -->
<rect width="680" height="470" rx="22" fill="#f1f5f2"/><text x="30" y="44" fill="#1d4638" font-size="20" font-weight="bold">02 / 路径选择 · 弹窗</text><text x="30" y="74" fill="#536c62" font-size="16">选择不同路径 → 查看内容 → 打开并关闭弹窗</text>
<rect id="c2a" x="30" y="100" width="190" height="50" rx="10" fill="#236f56"/><text x="125" y="132" text-anchor="middle" fill="white" font-size="18" pointer-events="none">A · 内容摘要</text>
<rect id="c2b" x="235" y="100" width="190" height="50" rx="10" fill="#3b5f83"/><text x="330" y="132" text-anchor="middle" fill="white" font-size="18" pointer-events="none">B · 发布检查</text>
<rect id="c2reset" x="440" y="100" width="210" height="50" rx="10" fill="#e1e9e3" stroke="#9fb0a3"/><text x="545" y="132" text-anchor="middle" fill="#334d40" font-size="18" pointer-events="none">回到初始状态</text>
<text x="40" y="204" fill="#667d70" font-size="18">请选择上方的一条路径。</text>
<g visibility="hidden"><set attributeName="visibility" to="visible" begin="c2a.click" fill="freeze"/><set attributeName="visibility" to="hidden" begin="c2b.click;c2reset.click" fill="freeze"/><rect x="30" y="175" width="620" height="175" rx="12" fill="#def2e5"/><text x="55" y="215" fill="#1d5941" font-size="21" font-weight="bold">路径 A · 内容摘要</text><text x="55" y="255" fill="#325947" font-size="17">把要点整理为一张清晰的阅读卡片。</text><text x="55" y="295" fill="#325947" font-size="17">✓ 结构完成　✓ 图文已就绪</text></g>
<g visibility="hidden"><set attributeName="visibility" to="visible" begin="c2b.click" fill="freeze"/><set attributeName="visibility" to="hidden" begin="c2a.click;c2reset.click" fill="freeze"/><rect x="30" y="175" width="620" height="175" rx="12" fill="#dcebf7"/><text x="55" y="215" fill="#31567c" font-size="21" font-weight="bold">路径 B · 发布检查</text><text x="55" y="255" fill="#3b5a72" font-size="17">核对标题、封面和移动端显示。</text><text x="55" y="295" fill="#3b5a72" font-size="17">✓ 标题完整　✓ 预览待确认</text></g>
<rect id="c2open" x="30" y="375" width="215" height="50" rx="10" fill="#283f36"/><text x="137" y="407" text-anchor="middle" fill="white" font-size="18" pointer-events="none">打开确认弹窗</text>
<g visibility="hidden"><set attributeName="visibility" to="visible" begin="c2open.click" fill="freeze"/><set attributeName="visibility" to="hidden" begin="c2close.click;c2reset.click" fill="freeze"/><rect width="680" height="470" rx="22" fill="#0d1c16" fill-opacity="0.72"/><rect x="95" y="130" width="490" height="215" rx="16" fill="white"/><text x="130" y="184" font-size="22" font-weight="bold" fill="#203d30">这是一个 SVG 弹窗</text><text x="130" y="224" font-size="17" fill="#52685d">选择和弹窗均为预设状态的视觉模拟。</text><rect id="c2close" x="130" y="265" width="180" height="48" rx="9" fill="#236f56"/><text x="220" y="296" text-anchor="middle" fill="white" font-size="18" pointer-events="none">关闭弹窗</text></g>
</svg>

</article></body></html>
