name: Check plugin releases

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node plugins/release.mjs --check
      # The DeepSeek market index is generated at deploy time; validate the shape
      # here so a broken package or locale fails before Pages ships it.
      - run: node scripts/build-market-index.mjs --check
      - run: node plugins/test.mjs
