<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="100%" style="display:block;max-width:600px" aria-label="自动播放的路径选择和弹窗演示"><rect width="680" height="350" rx="18" fill="#edf4ee"/><text x="25" y="38" fill="#234b39" font-size="21" font-weight="bold">预设流程演示 · 自动播放</text><text x="25" y="66" fill="#62786b" font-size="15">鼠标与点击均为模拟，不可操作</text>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.18;0.181;0.93;0.931;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/><rect x="25" y="90" width="630" height="235" rx="14" fill="#fff"/><text x="50" y="132" font-size="22" fill="#244d3a">首页 · 选择一条路径</text><rect x="50" y="170" width="210" height="65" rx="10" fill="#267152"/><text x="155" y="211" text-anchor="middle" fill="#fff" font-size="19">A · 内容摘要</text><rect x="280" y="170" width="210" height="65" rx="10" fill="#3b6384"/><text x="385" y="211" text-anchor="middle" fill="#fff" font-size="19">B · 发布检查</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.18;0.181;0.43;0.431;0.94;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/><rect x="25" y="90" width="630" height="235" rx="14" fill="#dff1e5"/><text x="50" y="132" font-size="22" fill="#23583b">A · 内容摘要</text><text x="50" y="170" font-size="18" fill="#456757">✓ 图文要点已整理</text><rect x="280" y="235" width="210" height="58" rx="9" fill="#3b6384"/><text x="385" y="271" text-anchor="middle" fill="#fff" font-size="18">切换到 B</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.43;0.431;0.68;0.681;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/><rect x="25" y="90" width="630" height="235" rx="14" fill="#deebf6"/><text x="50" y="132" font-size="22" fill="#294e71">B · 发布检查</text><text x="50" y="170" font-size="18" fill="#496980">✓ 标题、封面和预览已检查</text><rect x="280" y="235" width="210" height="58" rx="9" fill="#3b6384"/><text x="385" y="271" text-anchor="middle" fill="#fff" font-size="18">打开确认弹窗</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.681;0.93;0.931;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/><rect x="25" y="90" width="630" height="235" rx="14" fill="#294155"/><rect x="85" y="115" width="510" height="180" rx="14" fill="#fff"/><text x="115" y="157" font-size="22" fill="#294e71">确认预览</text><text x="115" y="195" font-size="18" fill="#52685d">流程演示结束，返回首页。</text><rect x="280" y="220" width="210" height="53" rx="9" fill="#3b6384"/><text x="385" y="254" text-anchor="middle" fill="#fff" font-size="18">返回首页</text></g>
